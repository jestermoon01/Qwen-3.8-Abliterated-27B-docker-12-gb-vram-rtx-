name: qwen-local
services:
  model-download:
    image: python:3.12-slim@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b
    restart: 'no'
    environment:
      PYTHONUNBUFFERED: '1'
    volumes:
      - models:/models
      - ./model-manifest.json:/setup/model-manifest.json:ro
      - ./scripts/download_model.py:/setup/download_model.py:ro
    command: [python, /setup/download_model.py, --manifest, /setup/model-manifest.json, --destination, /models/model.gguf]
  inference:
    image: ${LLAMA_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda@sha256:f8e7c336e3660804f6bc35a4147dbfdf1ddae9b7c3c50d412fab49b323e28fea}
    environment:
      LLAMA_ARG_SPEC_TYPE: ${SPEC_TYPE:-draft-mtp}
      LLAMA_ARG_SPEC_DRAFT_N_MAX: ${SPEC_DRAFT_MAX:-3}
      LLAMA_ARG_N_GPU_LAYERS_DRAFT: ${DRAFT_GPU_LAYERS:-all}
    gpus: all
    restart: unless-stopped
    volumes:
      - models:/models:ro
    depends_on:
      model-download:
        condition: service_completed_successfully
    command:
      - --model
      - /models/model.gguf
      - --alias
      - ${MODEL_ALIAS:-huihui-qwen3.8-27b}
      - --host
      - 0.0.0.0
      - --port
      - '8080'
      - --ctx-size
      - ${TOTAL_CONTEXT:-8192}
      - --parallel
      - ${PARALLEL_SLOTS:-1}
      - --threads
      - ${CPU_THREADS:-8}
      - --threads-batch
      - ${CPU_THREADS:-8}
      - --n-gpu-layers
      - ${GPU_LAYERS:-99}
      - --cache-type-k
      - ${CACHE_TYPE_K:-q4_0}
      - --cache-type-v
      - ${CACHE_TYPE_V:-q4_0}
      - --flash-attn
      - 'on'
      - --batch-size
      - '512'
      - --ubatch-size
      - ${UBATCH_SIZE:-64}
      - --cont-batching
      - --jinja
      - --no-context-shift
      - --chat-template-kwargs
      - '{"enable_thinking": ${ENABLE_THINKING:-false}}'
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8080/health]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
  qdrant:
    image: qdrant/qdrant:v1.17.0@sha256:f1c7272cdac52b38c1a0e89313922d940ba50afd90d593a1605dbbc214e66ffb
    restart: unless-stopped
    volumes:
      - qdrant:/qdrant/storage
  gateway:
    build: .
    restart: unless-stopped
    ports:
      - '127.0.0.1:${API_PORT:-8001}:8000'
    environment:
      AUTH_ENABLED: 'false'
      MODEL_ALIAS: ${MODEL_ALIAS:-huihui-qwen3.8-27b}
      WEIGHTS_FILE: ${MODEL_FILE:-huihui-27b-iq3_xxs.gguf}
      BACKEND: http://inference:8080
      CONTEXT_PER_SLOT: ${CONTEXT_PER_SLOT:-8192}
      PARALLEL_SLOTS: ${PARALLEL_SLOTS:-1}
      MAX_INFLIGHT: ${MAX_INFLIGHT:-8}
      ENABLE_THINKING: ${ENABLE_THINKING:-false}
      QDRANT_HOST: qdrant
      MEM0_TELEMETRY: 'false'
    volumes:
      - memory:/data
    depends_on:
      inference:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 180s
volumes:
  models:
  qdrant:
  memory:
