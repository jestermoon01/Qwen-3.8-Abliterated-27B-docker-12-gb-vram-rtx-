# 65,536 tokens per request, two slots, within this model's native 262K context.
# Restart the stack with BOTH compose files; never change only the gateway limit.
services:
  inference:
    environment:
      LLAMA_ARG_SPEC_TYPE: none
    # Command-line --ctx-size overrides environment, so replace the whole command.
    command: [--model, /models/model.gguf, --alias, huihui-qwen3.8-27b, --host, 0.0.0.0, --port, '8080', --ctx-size, '131072', --parallel, '2', --threads, '14', --threads-batch, '14', --n-gpu-layers, '32', --cache-type-k, q8_0, --cache-type-v, q8_0, --flash-attn, 'on', --batch-size, '512', --ubatch-size, '128', --cont-batching, --jinja, --no-context-shift, --no-kv-offload, --chat-template-kwargs, '{"enable_thinking": false}']
  gateway:
    environment:
      CONTEXT_PER_SLOT: '65536'
      PARALLEL_SLOTS: '2'
